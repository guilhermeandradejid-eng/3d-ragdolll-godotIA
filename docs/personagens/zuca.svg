  <text x="150" y="610" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">Teste de silhueta:</text>
  <text x="150" y="630" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">a forma precisa ser reconhecível</text>
  <text x="150" y="650" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">mesmo toda preenchida de preto.</text>
  <text x="560" y="92" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="54" font-weight="bold" fill="#fff8ec">Zuca</text>
  <text x="560" y="126" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#ff4fa3">A Inventora de Corda</text>
  <text x="560" y="156" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="16" fill="#bfb3d6">Heroína · Jogável · “Calculando… 97% de chance de dar certo!”</text>
  <line x1="560" y1="172" x2="1150" y2="172" stroke="#ffffff22"/>
  <text x="560" y="200" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ff4fa3" letter-spacing="1.5">PERSONALIDADE</text>
  <text x="560" y="224" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Hiperativa, fala rápido e calcula probabilidades para</tspan><tspan x="560" dy="23">tudo. Constrói geringonças com peças de relógio.</tspan></text>
  <text x="560" y="302" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ff4fa3" letter-spacing="1.5">HABILIDADE</text>
  <text x="560" y="326" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">A mais rápida da turma — mas escorrega nas curvas (pouca</tspan><tspan x="560" dy="23">tração).</tspan></text>
  <text x="560" y="404" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ff4fa3" letter-spacing="1.5">DESIGN</text>
  <text x="560" y="428" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Robô de lata dos anos 50: corpo rosa metálico com</tspan><tspan x="560" dy="23">clearcoat, cabeça-tela com olhos de LED, antena com</tspan><tspan x="560" dy="23">lâmpada e chave de corda que gira mais rápido quando</tspan><tspan x="560" dy="23">corre.</tspan></text>
  <text x="560" y="560" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#d9cfe8">Velocidade</text><rect x="680" y="547" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="726" y="547" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="772" y="547" width="40" height="14" rx="4" fill="#ff4fa3"/><text x="560" y="586" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#d9cfe8">Pulo</text><rect x="680" y="573" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="726" y="573" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="772" y="573" width="40" height="14" rx="4" fill="#ff4fa3"/><text x="560" y="612" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#d9cfe8">Peso</text><rect x="680" y="599" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="726" y="599" width="40" height="14" rx="4" fill="#ffffff22"/><rect x="772" y="599" width="40" height="14" rx="4" fill="#ffffff22"/><text x="560" y="638" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" fill="#d9cfe8">Tração</text><rect x="680" y="625" width="40" height="14" rx="4" fill="#ff4fa3"/><rect x="726" y="625" width="40" height="14" rx="4" fill="#ffffff22"/><rect x="772" y="625" width="40" height="14" rx="4" fill="#ffffff22"/>
