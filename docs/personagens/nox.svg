  <text x="150" y="610" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">Teste de silhueta:</text>
  <text x="150" y="630" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">a forma precisa ser reconhecível</text>
  <text x="150" y="650" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">mesmo toda preenchida de preto.</text>
  <text x="560" y="92" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="54" font-weight="bold" fill="#fff8ec">Nox</text>
  <text x="560" y="126" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#241638">A Mariposa do Eclipse</text>
  <text x="560" y="156" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="16" fill="#bfb3d6">Antagonista · Chefe final · “Todos sempre olham para a luz. Ninguém olha para a sombra!”</text>
  <line x1="560" y1="172" x2="1150" y2="172" stroke="#ffffff22"/>
  <text x="560" y="200" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#241638" letter-spacing="1.5">PERSONALIDADE</text>
  <text x="560" y="224" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">A sombra do Grande Farol. Passou a vida inteira ao redor</tspan><tspan x="560" dy="23">da luz sem nunca poder tocá-la — e a solidão virou fome.</tspan></text>
  <text x="560" y="302" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#241638" letter-spacing="1.5">HABILIDADE</text>
  <text x="560" y="326" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Orbes de sombra teleguiados, mergulho com onda de choque,</tspan><tspan x="560" dy="23">rajadas de asas e invocação de Sombrinhas.</tspan></text>
  <text x="560" y="404" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#241638" letter-spacing="1.5">DESIGN</text>
  <text x="560" y="428" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Mariposa gigante com asas de "olhos" brilhantes (shader</tspan><tspan x="560" dy="23">procedural), pelagem escura e o núcleo dourado da Chama</tspan><tspan x="560" dy="23">Primordial no peito — o ponto fraco. Na redenção, encolhe</tspan><tspan x="560" dy="23">e ganha tons de lavanda.</tspan></text>
  
  <text x="900" y="530" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#241638" letter-spacing="1.5">PALETA</text>
