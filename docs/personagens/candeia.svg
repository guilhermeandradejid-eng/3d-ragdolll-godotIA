  <text x="150" y="610" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">Teste de silhueta:</text>
  <text x="150" y="630" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">a forma precisa ser reconhecível</text>
  <text x="150" y="650" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="14" fill="#bfb3d6">mesmo toda preenchida de preto.</text>
  <text x="560" y="92" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="54" font-weight="bold" fill="#fff8ec">Vó Candeia</text>
  <text x="560" y="126" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="22" font-weight="bold" fill="#ffcf7a">A Guardiã do Grande Farol</text>
  <text x="560" y="156" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="16" fill="#bfb3d6">Mentora · Narradora · “Juntos, iluminam o céu inteiro.”</text>
  <line x1="560" y1="172" x2="1150" y2="172" stroke="#ffffff22"/>
  <text x="560" y="200" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ffcf7a" letter-spacing="1.5">PERSONALIDADE</text>
  <text x="560" y="224" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Sábia, doce e firme. Criou os quatro aprendizes e acende o</tspan><tspan x="560" dy="23">Grande Farol há mais noites do que se pode contar.</tspan></text>
  <text x="560" y="302" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ffcf7a" letter-spacing="1.5">HABILIDADE</text>
  <text x="560" y="326" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Guia os heróis pelo rádio de luz da sua candeia (a</tspan><tspan x="560" dy="23">lamparina de óleo que dá nome a ela).</tspan></text>
  <text x="560" y="404" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ffcf7a" letter-spacing="1.5">DESIGN</text>
  <text x="560" y="428" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="17" fill="#f3ecff"><tspan x="560" dy="0">Vaga-lume idosa: xale de lã, óculos redondos, coque</tspan><tspan x="560" dy="23">branco, antenas com pontas acesas e a candeia sempre na</tspan><tspan x="560" dy="23">mão.</tspan></text>
  
  <text x="900" y="530" font-family="'Trebuchet MS', Verdana, 'DejaVu Sans', sans-serif" font-size="15" font-weight="bold" fill="#ffcf7a" letter-spacing="1.5">PALETA</text>
